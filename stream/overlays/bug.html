<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Disheveled — Corner Bug</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_brand.css">
<style>
/* Transparent persistent watermark: brand mark + LIVE dot + "now covering" strap. */
.bug{position:fixed;top:44px;left:64px;z-index:30;display:flex;align-items:center;gap:18px}
.bug-mark{font-family:var(--display);font-size:34px;letter-spacing:.16em;color:var(--cream);
          text-shadow:0 2px 18px rgba(8,8,8,.9)}
.bug-live{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.3em;
          color:var(--cream);text-transform:uppercase;
          background:rgba(8,8,8,.72);border:1px solid var(--border);padding:9px 14px}
.strap{position:fixed;top:44px;right:64px;z-index:30;max-width:820px;
       display:flex;align-items:center;gap:16px;
       background:rgba(14,14,14,.9);border:1px solid var(--border);padding:14px 22px}
.strap-l{font-size:10px;letter-spacing:.35em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.strap-v{font-size:15px;letter-spacing:.16em;color:var(--cream);text-transform:uppercase;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strap-tick{width:4px;height:22px;background:var(--accent);flex-shrink:0}
</style>
</head>
<body>
<div class="bug">
  <div class="bug-mark" id="mark">DISHEVELED</div>
  <div class="bug-live" id="live"><span class="dot"></span><span>Live</span></div>
</div>
<div class="strap" id="strap">
  <div class="strap-tick"></div>
  <div>
    <div class="strap-l">Now Covering</div>
    <div class="strap-v" id="topic">Collection 001 — Site Walkthrough</div>
  </div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  // ?mark=DISHEVELED&topic=…&live=0&strap=0
  if(q.get('mark'))  document.getElementById('mark').textContent  = q.get('mark');
  if(q.get('topic')) document.getElementById('topic').textContent = q.get('topic');
  if(q.get('live')  === '0') document.getElementById('live').style.display  = 'none';
  if(q.get('strap') === '0' || q.get('topic') === '') document.getElementById('strap').style.display = 'none';
})();
</script>
</body>
</html>
